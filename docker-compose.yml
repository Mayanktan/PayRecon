# PayRecon infrastructure: MySQL (ledger + workflow), MongoDB (raw bank records + statements),
# Hive (analytics warehouse). MapReduce runs inside the Java app in Hadoop "local" mode.
#
# Passwords come from the .env file next to this file (never hard-coded).
name: payrecon

services:
  mysql:
    image: mysql:8.4
    container_name: payrecon-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: payrecon
      MYSQL_USER: ${PAYRECON_MYSQL_USER:-payrecon}
      MYSQL_PASSWORD: ${PAYRECON_MYSQL_PASSWORD:?Set PAYRECON_MYSQL_PASSWORD in .env}
    ports:
      - "3307:3306"          # 3307 on your Mac, so it never clashes with a native MySQL on 3306
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 40

  mongo:
    image: mongo:7.0
    container_name: payrecon-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 5s
      timeout: 5s
      retries: 40

  hive:
    image: apache/hive:4.0.1
    container_name: payrecon-hive
    environment:
      SERVICE_NAME: hiveserver2
    ports:
      - "10000:10000"        # HiveServer2 (JDBC / beeline)
      - "10002:10002"        # HiveServer2 web UI
    volumes:
      - ./data:/data         # Hive reads the files the Java app writes (read-only use)
      - ./hive:/opt/payrecon/hive:ro

volumes:
  mysql-data:
  mongo-data:
